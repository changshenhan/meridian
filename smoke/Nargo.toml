[package]
name = "smoke"
version = "0.1.0"
type = "bin"
authors = ["Mist Labs"]

# 为什么在仓库根，不在 circuits/ 下：nargo 1.0 把「从当前目录向上找最近的顶层
# Nargo.toml」当作 workspace 根。若 smoke 位于 circuits/ 内，nargo 会把
# spend_authorization 包（circuits/Nargo.toml）当 workspace 根并强制选根包，报
# "Selected package spend_authorization was not found"（CI run 31906697733 实测）。
# 而 nargo 1.0 禁止同一文件同时出现 [package] 与 [workspace]（TOML parse 直接报错，
# CI run 31926076308 实测）。因此 smoke 独立成顶层包：它自己的 Nargo.toml 就是顶层，
# 构成隐式单包 workspace（与 spend_authorization 同理），无需再写 [workspace]。

# TEMPORARY —— S-05 管线冒烟脚手架（secp256k1 blackbox）。
# 目标：在 CI 上跑通 nargo prove → bb verify → 公共输入回读 全链路，为正式电路铺路。
# 仅 stdlib 依赖（无外部库）；验证完成后删除，不进 SPEC / 文档。
