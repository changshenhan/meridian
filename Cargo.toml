[workspace]
resolver = "2"
members = ["core", "aggregator", "bench", "facilitator", "gateway", "mcp-server", "sdk", "monitor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
authors = ["Mist Labs"]

[workspace.dependencies]
mist-core = { path = "core" }
mist-aggregator = { path = "aggregator" }
mist-facilitator = { path = "facilitator" }
mist-gateway = { path = "gateway" }
mist-sdk = { path = "sdk" }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
crc32fast = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
proptest = "1"
rand = "0.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
