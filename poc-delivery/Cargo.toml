[package]
name = "meridian-poc-delivery"
version = "0.1.0"
edition = "2021"
description = "Meridian S-08b PoC ③ 交付证明：TLSNotary 2-party MPC-TLS 最小原型"
license = "Apache-2.0"

# 独立 workspace：poc-delivery 嵌套在 meridian 仓库内但不挂主 workspace
# （tlsn 拉 mpz 大框架，编译重，不进 CI 常规 workspace）。自带 Cargo.lock。
[workspace]

# 独立 crate：不挂 workspace（tlsn 拉 mpz 大框架，编译重，不进 CI 常规 workspace）。
# 复现：cd poc-delivery && cargo run --release

[dependencies]
# TLSNotary（tlsnotary/tlsn）。未发布到 crates.io，走 git 锁 release tag。
# 2-party MPC-TLS：prover + verifier 共同见证对交付端点的 TLS 会话。
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15", package = "tlsn" }

# 交付服务器（本地 TLS 端点，模拟"收款方"）：自签 CA + 叶证书，tokio-rustls 承载。
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws_lc_rs"] }

# HTTP/1.1 请求-响应（交付 POST → ack）。
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
