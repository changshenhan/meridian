# S-30c facilitator —— x402 merchant 参考实现（TECH_SPEC §6.9）。
#
# 受保护资源服务器参考：验证逻辑 = 对 Meridian 网关查回执（S-30a），零密码学依赖。
# std-only 手写 HTTP/1.1（§6.7 同先例）；axum/tokio 允许但不必要。
[package]
name = "meridian-facilitator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Meridian x402 merchant reference implementation (S-30c)"

[dependencies]
meridian-sdk = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
# EIP-3009 兼容桥（S-32，§6.10）：ecrecover + keccak256——均为 workspace 既有依赖，
# 不引新外部包。桥不进内核热路径（§6.9 同口径）。
k256 = { workspace = true }
sha3 = { workspace = true }

# e2e：真聚合器 + 真网关（三角色验收）。
[dev-dependencies]
meridian-aggregator = { workspace = true }
meridian-core = { workspace = true }
meridian-gateway = { workspace = true }
