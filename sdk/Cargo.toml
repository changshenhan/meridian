# S-12 SDK —— agent 侧客户端库（封装 core + 聚合器，暴露 authorize/pay/attest + 幂等重试）。
#
# 技术来源（MASTER_PLAN S-12）：core crate 复用；tower/retry 模式（本 crate 以轻量
# RetryPolicy 实现同构模式，不引入 tokio——聚合器是同步内核，agent 进程无需 async 运行时）。
[package]
name = "mist-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Mist agent SDK: authorize()/pay()/attest() with idempotent retry"

[dependencies]
mist-core = { workspace = true }
mist-aggregator = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hex = { workspace = true }
