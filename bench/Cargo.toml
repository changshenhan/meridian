[package]
name = "meridian-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
meridian-core.workspace = true
# S-10 生产内核（B7 承诺 lattice、B8 零分配钩子、B5/B6/B10/B11 全管线）。
meridian-aggregator.workspace = true
# PoC ② ingest 夹具要用 agent 签名原语现场造意图（与 core 同版本）。
ed25519-dalek.workspace = true
# agg_sim 生产内核 B5：有界 rayon 线程池（submit_batch，MASTER_PLAN 技术源）。
rayon.workspace = true
# s10_fixture 规范哈希（sha256）与 B7 承诺根同源。
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "dsa_bench"
path = "benches/dsa_bench.rs"
harness = false

[[bench]]
name = "ledger_bench"
path = "benches/ledger_bench.rs"
harness = false

[[bench]]
name = "aggregator_bench"
path = "benches/aggregator_bench.rs"
harness = false

[[bin]]
name = "gate"
path = "src/bin/gate.rs"
