name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: bench (compile only)
        run: cargo bench -p mist-bench --no-run

      # 性能门禁（TECH_SPEC §8.3）：同一 runner 上先记录再比对，机器无关。
      # GitHub Actions runner 共享 CPU，实测噪声可到 ±10% 以上（intent_verify_ops
      # 是 ~35µs 的 Ed25519 验签，对 turbo/争用最敏感，曾测出 -10.28% 假阳性）。
      # 阈值必须高于噪声地板：CI 用 15% 抓灾难性回归，1% 精准基线（§6.5）留在
      # 受控参考平台上手动执行：
      #   cargo run --release -p mist-bench --bin gate -- --record
      #   cargo run --release -p mist-bench --bin gate -- --fail-over 1
      # S-35b：--ci 追加共享 runner 噪声地板阈值（agg_kernel_ingest_ops 25%）——
      # 6400 笔 ≈ 0.2s 短突发指标的 record/compare 阶段级漂移实测 -16~20%，15% 低于
      # 噪声地板等于抛硬币（TECH_SPEC §8.3）。本地参考机不传 --ci，精度口径不变。
      - name: perf gate (release)
        run: |
          cargo run --release -p mist-bench --bin gate -- --record
          cargo run --release -p mist-bench --bin gate -- --ci --fail-over 15

      # S-10 聚合器内核硬断言回归（确定性，机器无关）：B8 热路径零分配 + B11 确定性
      # （同 seed 两跑 lattice 输出哈希一致）。全量 B5/B6/B7/B10 验收在参考机跑
      # `agg_sim` 全量报告（CI runner 共享 CPU，绝对吞吐不可靠，只守硬断言与趋势）。
      # 复用上方 gate 的 release 构建，无额外编译开销。
      - name: agg_sim regression (B8 zero-alloc + B11 determinism)
        run: |
          cargo run --release -p mist-bench --bin agg_sim -- --check-alloc
          cargo run --release -p mist-bench --bin agg_sim -- --check-determinism

  # Noir（S-05）—— Windows 无法构建 nargo_cli v1.0.0-beta.26（termion 仅 unix），
  # 且该版本无 Windows 预编译二进制、无 prove/verify 子命令（proving 已外移到 bb）。
  # 因此本 job 是 ZK 电路**唯一**的验证路径：compile/test/约束数 + 完整 prove/verify/回读。
  # 工具链锁定：nargo v1.0.0-beta.26 + bb（bbup 默认，见 circuits/README.md）。
  noir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install nargo v1.0.0-beta.26 (pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          "$HOME/.nargo/bin/noirup" --version 1.0.0-beta.26

      - name: Install barretenberg (bbup, pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          # nargo v1.0.0-beta.26 未入 bbup 的 bb-versions.json（最细到 beta.22），须显式给版本。
          # 配对依据：noir v1.0.0-beta.26 的 EXTERNAL_NOIR_LIBRARIES.yml 钉 aztec-packages
          # commit 0e7787a（2026-07-24）→ barretenberg v6.0.0-nightly.20260724。
          "$HOME/.bb/bbup" --version 6.0.0-nightly.20260724
          "$HOME/.bb/bb" --version

      # S-05 验收：电路编译通过；约束数记录在案；正/负向测试框架就位。
      - name: spend_authorization — compile, tests, constraint count
        working-directory: circuits
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          nargo fetch
          nargo compile
          nargo test
          nargo info

      # TEMPORARY 冒烟：跑通 prove → verify → 公共输入回读 管线。
      - name: smoke — prove → verify → public-input readback
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          bash scripts/smoke_zk.sh

      # S-09 正式电路端到端：gen-witness（Noir 内确定性签名 + 撤销树）→ 正式电路
      # prove/verify/公共输入回读(121)/负向篡改 → B2/B3/B4 计时基线 + 约束门禁(<2^18)
      # → bb write_solidity_verifier -t evm-no-zk EVM 验证器（Phase 4 复用；keccak
      # flavor，与 4/8 write_vk/prove/verify 的 -t evm-no-zk 一致）。
      # smoke 保持 TEMPORARY 原状不动。
      - name: formal — gen-witness → prove → verify → readback → negative → bench → EVM verifier
        run: |
          bash scripts/formal_zk.sh

      # S-40（TECH_SPEC §6.13）：bb 后端 e2e——Rust 侧 BbVerifier 吃真证明（正/负向）。
      # ubuntu 原生 bb 走 Native 分支；公共输入从 Prover.toml 第三实现重建，与本地
      # verify.sh 9b 同一测试。runner 镜像自带 rustc/cargo，noir job 已复用 rust-cache。
      - name: bb-verify e2e (S-40)
        run: |
          export PATH="$HOME/.bb:$PATH"
          MIST_BB_E2E=1 cargo test -p mist-aggregator --test bb_verify_e2e

      # S-43（TECH_SPEC §6.14）：真 prover e2e——SDK 侧 NoirProver 出真证明（Noir
      # oracle + 电路断言 1-9 自校验 + bb prove）× BbVerifier 密码学验证。与本地
      # verify.sh 步 9c 同一测试；nargo 走 ubuntu 原生 PATH。
      - name: noir-prover e2e (S-43)
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          MIST_ZK_PROVER_E2E=1 cargo test -p mist-sdk --test noir_prover_e2e

      # S-47（TECH_SPEC §6.10/§6.14）：桥接真 prover e2e——facilitator EIP-3009 桥经
      # BridgeConfig.noir（SdkClient::with_noir）在真 BbVerifier 网关上摄取成功；
      # 占位桥对照组 402（bb 全拒占位证明）。与本地 verify.sh 步 9d 同一测试
      # （过滤器只选 noir 桥用例），nargo 走 ubuntu 原生 PATH。
      - name: bridge noir-prover e2e (S-47)
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          MIST_ZK_PROVER_E2E=1 cargo test -p mist-facilitator --test facilitator e2e_bridge_with_noir_prover

      # S-52（TECH_SPEC §6.16）：MCP 面真 ZK e2e——客户端侧 NoirProver 真电路证明经
      # MCP pay 工具直通（keyless 保形：服务器只验证），BbVerifier + 撤销根绑定闸聚合器
      # 密码学接受；对照组占位 pay 必拒 E_PROOF。与本地 verify.sh 步 9f 同一测试。
      - name: mcp noir-prover e2e (S-52)
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          MIST_MCP_NOIR_E2E=1 cargo test -p mist-mcp --test mcp_noir_e2e

      - name: upload ZK artifacts (baseline report + EVM verifier)
        uses: actions/upload-artifact@v4
        with:
          name: zk-s09-artifacts
          path: |
            circuits/bench/baseline_s09.json
            circuits/artifacts/UltraVerifier.sol
          if-no-files-found: error

  # Solidity 合约（S-06）—— forge test + alloy 链上冒烟。
  # foundry 版本与本机对齐（1.7.1 / commit 4072e48）以确保产物稳定；
  # forge-std 通过 foundry.lock（v1.9.6, rev 3b20d60）锁定，CI 侧 forge install 拉取。
  # 注：contracts/lib/、out/ 在 .gitignore 中，CI 各自构建。
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # runner 是 bash --noprofile --norc：安装器写入的 .bashrc 不会生效。
      # foundryup 安装器的落点是 ${XDG_CONFIG_HOME:-$HOME}/.foundry，CI 上实测与
      # $HOME/.foundry 不一致（export PATH 后仍 foundryup: command not found，exit 127）。
      # 因此绕开 foundryup，直接下载钉死版本 v1.7.1 的官方 release 产物
      # foundry_v1.7.1_linux_amd64.tar.gz（含 forge/cast/anvil，与本地 foundryup 同源）。
      - name: Install foundry (pinned to local 1.7.1)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/foundry.tar.gz \
            "https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_linux_amd64.tar.gz"
          mkdir -p "$HOME/.foundry/bin"
          tar -xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
          chmod +x "$HOME/.foundry/bin/"*
          export PATH="$HOME/.foundry/bin:$PATH"
          forge --version

      - name: Install forge-std (pinned by foundry.lock)
        working-directory: contracts
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          forge install forge-std=foundry-rs/forge-std@v1.9.6

      - name: forge build + test
        working-directory: contracts
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          forge build
          forge test

      # S-58（TECH_SPEC §8.3，审计四步路径 ④）：分支覆盖门禁，与本地 verify.sh 步 8c
      # 同一脚本同阈值（src 全合约行/函数 100%、分支 100%，BatchSettler 豁免 1 条
      # 结构不可达边——押金销毁 require 失败边，口径见脚本文件头）。
      - name: coverage gate (S-58)
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          bash scripts/coverage_gate.sh

      # 链上冒烟：spawn anvil → 部署三合约 → register→revoke→commit→settle 全链路。
      # 交叉实现契约：Solidity sha256(delegationABI) == mist-core delegation_hash。
      - name: alloy smoke — anvil deploy + full chain
        working-directory: contracts/rust-smoke
        run: |
          export PATH="$HOME/.foundry/bin:$PATH"
          cargo run

