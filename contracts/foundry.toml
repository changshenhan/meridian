# Foundry 配置（S-06，决策记录见 contracts/README.md）
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Base（OP Stack，EIP-4844 支持 Cancun）与 Anvil 都按 Cancun 对齐。
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# DelegationHelper 的 bytes.concat 多参数在经典编译下 stack-too-deep → via-ir 解决。
via_ir = true

# S-57：差分测试读 Rust 侧生成的 golden fixture（test/Differential.t.sol）。
# 最小授权——只开放 fixtures 目录读，不放开项目根。
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# 审计加固第二轮（四步路径 ②）：BatchSettler 状态机 invariant fuzz
# （test/BatchSettlerInvariant.t.sol）。fail_on_revert 缺省 false——handler 的
# 预期外 revert（窗口过期后的挑战等）静默跳过；真断言全在不变量函数与 try/catch 行为旗里。
[invariant]
runs = 64
depth = 256


[fmt]
line_length = 100
tab_width = 4
